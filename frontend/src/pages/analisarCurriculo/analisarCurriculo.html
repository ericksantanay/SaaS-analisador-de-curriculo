<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisar Curriculo</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon"
    />
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="analisarCurriculo.css">
</head>
<body>

    <main>
            <!-- Segunda seção -->
        <section id="segunda-secao-secao-analisador-curriculo">

            <article id="container-form-analisador-de-curricuclo">

                <form id="formulario-analisador-decurriculo">

                    <div id="container-upload-do-cv">

                        <input type="file" name="upload-cv" id="upload-cv" required />
                        <span class="material-symbols-outlined" id="icone-upload">attach_file</span>

                    </div>

                    <div id="container-prompt">
                        <input
                            type="text"
                            name="prompt-analise-curriculo"
                            id="prompt-analise-curriculo"
                            placeholder="Ex: Desenvolvedor Backend, Gerente de Loja, Designer Gráfico..."
                            required/>
                    </div>

                    <div id="container-btn-enviar-curriculo">
                        <button id="btn-enviar-curriculo" type="submit">
                            <span class="material-symbols-outlined" id="icone-fazer-analise"
                            >arrow_upward_alt</span
                            >
                        </button>
                    </div>
                </form>
            </article>
        </section>
    </main>
    
</body>
</html>
