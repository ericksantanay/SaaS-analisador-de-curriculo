<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisar Curriculo</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon"
    />
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="analisarCurriculo.css">
    <link rel="stylesheet" href="../../components/navbar.css">
</head>
<body>

    <!-- Parte do topo -->
      <header>

        <!-- Parte da navegação -->
        <nav id="container-nav-bar">

          <!-- Container logo AULTO -->
          <div id="lado-esquerdo-nav-bar">
            <img
              src="../../assets/image/Logo + Logotipo(R)Novo.png"
              alt="Logotipo AULTO"
            />
          </div>

          <!-- Lado direito / área de navegação -->
          <div id="container-links-nav-bar">
            <ul>
              <li><a href="#">Inicio</a></li>
              <li><a href="#">Nova análise</a></li>
              <li><a href="#">Relatorio</a></li>
              <li><a href="#">Planos</a></li>
              <li><a href="#">Historico</a></li>
            </ul>
          </div>

          <!-- Container login e criar conta -->
          <div class="container-login-e-criar-conta">
            <a class="link-para-login" href="#">Sing in</a>
            <a class="btn-criar-conta" href="#">Create account</a>
          </div>

          <!-- Menu hamburguer -->
          <div class="container-menu-burguer">
            <span
              class="material-symbols-outlined"
              id="menu-burguer"
              onclick="menuBurguer()"
            >
              menu
            </span>
          </div>

          <!-- Menu da versão mobile -->
          <div id="container-links-para-versao-mobile">

            <ul>
              <li><a href="#">Inicio</a></li>
              <li><a href="#">Nova análise</a></li>
              <li><a href="#">Relatorio</a></li>
              <li><a href="#">Planos</a></li>
              <li><a href="#">Historico</a></li>
            </ul>

          </div>

        </nav>

      </header>

      <main>

          <!-- Segunda seção -->
          <section id="segunda-secao-secao-analisador-curriculo">

              <article id="container-form-analisador-de-curricuclo">

                  <form id="formulario-analisador-decurriculo">

                      <div id="container-upload-do-cv">
                          <input
                              type="file"
                              name="upload-cv"
                              id="upload-cv"
                              required
                          />

                          <span
                              class="material-symbols-outlined"
                              id="icone-upload"
                          >
                              attach_file
                          </span>
                      </div>

                      <div id="container-prompt">
                          <input
                              type="text"
                              name="prompt-analise-curriculo"
                              id="prompt-analise-curriculo"
                              placeholder="Ex: Desenvolvedor Backend, Gerente de Loja, Designer Gráfico..."
                              required
                          />
                      </div>

                      <div id="container-btn-enviar-curriculo">

                          <button
                              id="btn-enviar-curriculo"
                              type="submit"
                          >
                              <span
                                  class="material-symbols-outlined"
                                  id="icone-fazer-analise"
                              >
                                  arrow_upward_alt
                              </span>
                          </button>

                      </div>

                  </form>

              </article>

          </section>

      </main>

    
</body>
</html>
