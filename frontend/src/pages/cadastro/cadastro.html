<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vulto cadastro</title>

    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet" href="../../global.css">
</head>

<body>

    <section id="container-fomulario-cadastro">

        <form id="formulario-cadastro">

            <div class="container-inputs">
                <label for="nome">Nome</label>

                <input
                    type="text"
                    name="nome"
                    id="nome"
                    placeholder="Seu primeiro nome"
                    required
                >
            </div>


            <div class="container-inputs">
                <label for="email">Email</label>

                <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="Seu e-mail"
                    required
                >
            </div>


            <div class="container-inputs">
                <label for="senha">Senha</label>

                <input
                    type="password"
                    name="senha"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >
            </div>


            <div id="container-botoes-cadastro">

                <a id="btn-voltar" href="../../../index.html">
                    Voltar
                </a>

                <button id="btn-cadastro" type="submit">
                    Cadastrar
                </button>

            </div>

        </form>

    </section>

    <script src="../../../dist/service/cadastro.js"></script>

</body>

</html>
